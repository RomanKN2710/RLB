<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250">
  <rect x="0" y="0" width="1000" height="1000" fill="#D20515"/>
  <g fill="#fff" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Kopf, leicht nach hinten geneigt -->
    <circle cx="392" cy="112" r="52" stroke="none"/>
    <!-- Hals -->
    <path d="M385 165 L378 195" fill="none" stroke-width="30"/>
    <!-- Rumpf: breite Schultern, schmale Hüfte, leicht nach hinten gelehnt -->
    <path d="M318 195 Q300 300 268 425 L378 442 Q425 320 458 190 Z" stroke-width="14"/>
    <!-- Hose -->
    <path d="M266 420 L382 438 L398 535 L258 522 Z" stroke-width="12"/>
    <!-- hinterer Arm: nach hinten oben gestreckt -->
    <path d="M332 212 L205 195" fill="none" stroke-width="40"/>
    <path d="M205 195 L82 232" fill="none" stroke-width="30"/>
    <circle cx="74" cy="236" r="16" stroke="none"/>
    <!-- vorderer Arm: am Körper nach unten -->
    <path d="M448 222 L505 320" fill="none" stroke-width="38"/>
    <path d="M505 320 L470 405" fill="none" stroke-width="30"/>
    <!-- Schussbein: Oberschenkel, Unterschenkel, Schuh in Schussrichtung -->
    <path d="M365 480 L600 452" fill="none" stroke-width="84"/>
    <path d="M600 452 L790 500" fill="none" stroke-width="62"/>
    <path d="M776 470 L858 490 L888 522 L872 548 L830 545 L770 528 Z" stroke-width="8"/>
    <!-- Standbein: hinten angewinkelt -->
    <path d="M290 505 L332 700" fill="none" stroke-width="80"/>
    <path d="M332 700 L165 815" fill="none" stroke-width="60"/>
    <path d="M118 780 L188 802 L178 862 L122 878 L86 838 Z" stroke-width="8"/>
    <!-- Ball -->
    <circle cx="905" cy="415" r="56" stroke="none"/>
  </g>
  <text x="500" y="1228" text-anchor="middle" font-family="'Barlow Condensed','Arial Black','DejaVu Sans',sans-serif" font-weight="800" font-size="270" letter-spacing="30" fill="#1A1A1A">RLB</text>
</svg>
